name = "mateat-recipe-worker"
main = "index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# 공감 수처럼 화면 스크립트가 채우는 값을 읽기 위한 Cloudflare 헤드리스 브라우저(Browser Rendering)
[browser]
binding = "BROWSER"

[vars]
ALLOWED_ORIGIN = "https://wiitytily0529.github.io"
# 나머지는 저장소에 남지 않도록 `wrangler secret put`으로 넣습니다:
# PASSCODE, ANSWER_API_BASE_URL, ANSWER_API_KEY, ANSWER_API_MODEL
