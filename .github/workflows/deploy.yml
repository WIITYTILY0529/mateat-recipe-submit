name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect site files
        run: mkdir _site && cp index.html _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # 올린 직후에는 GitHub가 artifact를 아직 목록에 보여 주지 않아 배포가 "No artifacts" 로 실패하곤 해서 잠시 기다립니다.
      - run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v4
